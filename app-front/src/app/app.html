<nav class="navbar">
  <a class="nav-brand" href="/"><span class="mat-icon lg">sports_esports</span> LetsPlayTogether</a>

  <div class="nav-links">
    <a
      routerLink="/admin"
      routerLinkActive="active"
      *ngIf="auth.isAdmin()"
    >
      <span class="mat-icon sm">admin_panel_settings</span> Admin
    </a>
  </div>

  <div class="nav-user" *ngIf="auth.isLoggedIn() && !auth.isAdmin()">
    <a
      *ngIf="auth.currentUser() as yo"
      [routerLink]="['/usuarios', yo._id]"
      routerLinkActive="active"
      ><span class="mat-icon sm">account_circle</span> Mi perfil</a
    >
    <button type="button" (click)="cerrarSesion()"><span class="mat-icon sm">logout</span> Cerrar sesión</button>
  </div>
</nav>

<main [class.main-with-fixed-footer]="esMain()">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer" [class.app-footer-fixed]="esMain()">
  <small>LetsPlayTogether - Redes oficiales</small>
  <div class="social-links">
    <a href="#" aria-label="Discord" title="Discord"><span class="mat-icon sm">forum</span></a>
    <a href="#" aria-label="Instagram" title="Instagram"><span class="mat-icon sm">photo_camera</span></a>
    <a href="#" aria-label="X" title="X"><span class="mat-icon sm">tag</span></a>
    <a href="#" aria-label="Twitch" title="Twitch"><span class="mat-icon sm">live_tv</span></a>
  </div>
</footer>
