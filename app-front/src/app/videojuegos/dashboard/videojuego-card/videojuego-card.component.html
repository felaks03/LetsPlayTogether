<div class="card">
    <div class="card-imagen">
        <img *ngIf="videojuego.imagen" [src]="videojuego.imagen" [alt]="videojuego.titulo" />
        <div *ngIf="!videojuego.imagen" class="placeholder-img">🎮</div>
    </div>

    <div class="card-contenido">
        <div class="genero-badge" *ngIf="videojuego.genero">{{ videojuego.genero }}</div>

        <h3 class="titulo">{{ videojuego.titulo }}</h3>

        <div class="calificacion" *ngIf="videojuego.puntuacion != null">
            <span *ngFor="let star of obtenerEstrellas()" class="estrella">{{ star }}</span>
            <span class="puntuacion">({{ videojuego.puntuacion }}/10)</span>
        </div>

        <div class="plataformas">
            <span *ngFor="let plataforma of videojuego.plataformas" class="plataforma-badge">
                {{ plataforma }}
            </span>
        </div>

        <div class="pie-card">
            <span class="jugadores-activos">Jugadores activos: por hacer</span>
            <a [routerLink]="['/videojuegos', videojuego._id]" class="btn-detalles">Ver Detalles</a>
        </div>
    </div>
</div>
