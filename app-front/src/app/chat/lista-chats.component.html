<h2>Mis chats</h2>
<div *ngIf="cargando()">Cargando...</div>
<div *ngIf="error()">{{ error() }}</div>
<ul *ngIf="!cargando() && !error()">
  <li *ngFor="let c of chats()">
    <a [routerLink]="['/chats', c._id]">Chat con {{ nombreOtro(c) }}</a>
  </li>
</ul>
<p *ngIf="!cargando() && !error() && !chats().length">No tienes chats. Abre uno desde el perfil de un usuario.</p>
