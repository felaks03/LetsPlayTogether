<div class="dashboard-container">
    <div class="header">
        <h1>Dashboard de Videojuegos</h1>
        <p>Explora los mejores juegos disponibles</p>
    </div>

    <div class="buscador">
        <input 
            type="text" 
            class="input-busqueda"
            placeholder="Buscar por nombre o género..."
            [(ngModel)]="terminoBusqueda">
    </div>

    <div class="videojuegos-grid">
        <app-videojuego-card *ngFor="let vj of videojuegosFiltrados" [videojuego]="vj">
        </app-videojuego-card>
    </div>

    <div *ngIf="videojuegosFiltrados.length === 0" class="sin-resultados">
        <p>No hay videojuegos disponibles</p>
    </div>
</div>
